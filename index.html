<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Billing Gaming VIP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Font bertema Gaming/Futuristik */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
            background-color: #050505;
            overflow-x: hidden;
            /* Latar belakang dengan pola Grid halus khas tema Cyber */
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
        }

        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }

        /* --- ANIMASI CAHAYA (RGB GLOW) Latar Belakang --- */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0, 229, 255, 0.1) 40%, rgba(0,0,0,0) 70%);
            z-index: -1;
            filter: blur(60px);
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* --- PANEL KARTU GAMING --- */
        .cyber-panel {
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            /* Potongan sudut (clip-path) khas UI Sci-Fi/Gaming */
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
            position: relative;
        }
        
        /* Aksen garis neon di atas panel */
        .cyber-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
            box-shadow: 0 0 10px #00e5ff;
        }

        /* Styling Input Angka Modern/Gaming */
        input[type="text"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-bottom: 2px solid #00e5ff;
            color: #fff;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }
        
        input[type="text"]:focus {
            background: rgba(0, 229, 255, 0.05);
            border-color: #b14bf4;
            border-bottom: 2px solid #b14bf4;
            box-shadow: 0 5px 20px rgba(177, 75, 244, 0.3);
            outline: none;
        }

        /* Teks Gradasi Neon */
        .text-neon-cyan {
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        .text-neon-purple {
            color: #b14bf4;
            text-shadow: 0 0 10px rgba(177, 75, 244, 0.5);
        }

        /* Tombol Gaming / Cyberpunk */
        .btn-cyber {
            background: linear-gradient(90deg, #b14bf4, #00e5ff);
            color: black;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.2s ease;
            border: none;
            position: relative;
            z-index: 1;
        }
        
        .btn-cyber:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
            filter: brightness(1.2);
        }
        
        .btn-cyber:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Efek Berdering (Bahaya/Merah) */
        @keyframes alarmGlow {
            0% { background-color: rgba(20, 0, 0, 0.9); box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.5); }
            50% { background-color: rgba(50, 0, 0, 0.95); box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.8); }
            100% { background-color: rgba(20, 0, 0, 0.9); box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.5); }
        }
        .bg-alarm-active {
            animation: alarmGlow 0.8s infinite alternate;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.2), rgba(0,0,0,0.2) 10px, rgba(255,0,0,0.1) 10px, rgba(255,0,0,0.1) 20px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center selection:bg-cyan-500 selection:text-black">

    <div class="ambient-glow"></div>

    <!-- Header Waktu -->
    <div class="absolute top-6 w-full text-center z-10">
        <p class="text-cyan-400 text-xs font-bold tracking-[0.3em] uppercase mb-1 font-cyber">SYSTEM.TIME</p>
        <div class="bg-black/60 px-6 py-2 border-l-2 border-r-2 border-cyan-500 inline-block shadow-[0_0_15px_rgba(0,229,255,0.2)]">
            <h2 id="liveClock" class="text-2xl font-cyber tracking-widest text-white text-neon-cyan">00:00:00</h2>
        </div>
    </div>

    <!-- Kartu Utama -->
    <div class="cyber-panel p-8 md:p-10 flex flex-col items-center w-[92%] max-w-lg z-10 transition-all duration-500 mt-4">
        
        <!-- --- TAMPILAN PENGATURAN --- -->
        <div id="setupView" class="w-full flex flex-col items-center">
            <div class="flex items-center gap-3 mb-2">
                <svg class="w-8 h-8 text-neon-purple" fill="currentColor" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <h1 class="text-3xl md:text-4xl font-cyber font-bold text-white uppercase tracking-wider text-neon-cyan">Billing VIP</h1>
            </div>
            <p class="text-sm text-cyan-500/70 mb-8 text-center font-semibold tracking-widest uppercase">Initializing Session...</p>
            
            <!-- Input Nominal Uang -->
            <div class="w-full mb-6">
                <label class="block text-xs font-bold text-cyan-400 tracking-[0.2em] uppercase mb-3 text-left">Input Credits (Rp)</label>
                <div class="relative flex items-center justify-center">
                    <span class="absolute left-6 text-2xl font-cyber text-cyan-600">Rp</span>
                    <input type="text" inputmode="numeric" id="uangInp" placeholder="10.000" 
                        class="w-full h-20 pl-16 pr-6 text-4xl md:text-5xl text-left font-cyber tracking-wider">
                </div>
                <!-- Peringatan Dinamis -->
                <p id="warningText" class="text-red-500 text-sm font-bold mt-3 text-center opacity-0 transition-opacity bg-red-950/50 py-1 rounded border border-red-500/50">Error: Minimum credits not met.</p>
            </div>

            <!-- Info Real-time (Durasi & ETA) -->
            <div class="w-full bg-black/60 border border-cyan-500/30 p-5 mb-8 flex flex-col justify-center gap-3 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-cyan-500"></div>
                <div class="flex justify-between items-center text-sm border-b border-cyan-900/50 pb-2">
                    <span class="text-slate-400 uppercase tracking-widest text-xs font-bold">Time Acquired:</span>
                    <span id="durasiText" class="font-bold text-lg text-cyan-400 font-cyber">-</span>
                </div>
                <div class="flex justify-between items-center text-sm pt-1">
                    <span class="text-slate-400 uppercase tracking-widest text-xs font-bold">Session Ends:</span>
                    <span id="etaText" class="font-bold text-xl text-neon-purple font-cyber">--:--</span>
                </div>
            </div>

            <!-- Tombol Mulai -->
            <button id="startBtn" disabled class="w-full btn-cyber py-4 text-lg">
                <span class="relative z-10 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Start Session
                </span>
            </button>
        </div>

        <!-- --- TAMPILAN HITUNG MUNDUR --- -->
        <div id="countdownView" class="w-full hidden flex-col items-center py-2">
            <div class="flex items-center gap-3 mb-6 bg-cyan-950/40 px-5 py-2 border border-cyan-500/50">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full bg-cyan-400 opacity-75"></span>
                  <span class="relative inline-flex h-3 w-3 bg-cyan-500 shadow-[0_0_8px_#00e5ff]"></span>
                </span>
                <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-[0.2em] font-cyber">STATUS: ACTIVE</h2>
            </div>
            
            <div id="countdownDisplay" class="text-6xl md:text-7xl font-cyber text-white mb-8 text-center tabular-nums text-neon-cyan">
                00:00:00
            </div>
            
            <div class="w-full grid grid-cols-2 gap-4 mb-10 text-center">
                <div class="bg-black/50 border border-slate-700 p-3 relative">
                    <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-cyan-500"></div>
                    <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-cyan-500"></div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">End Time</p>
                    <p id="targetTimeDisplay" class="text-xl font-bold text-white font-cyber">--:--</p>
                </div>
                <div class="bg-black/50 border border-slate-700 p-3 relative">
                    <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-purple-500"></div>
                    <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-purple-500"></div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">Credits</p>
                    <p id="activePriceDisplay" class="text-xl font-bold text-neon-purple font-cyber">Rp 0</p>
                </div>
            </div>

            <button id="cancelBtn" class="w-full bg-transparent hover:bg-red-950/50 border border-red-600/50 hover:border-red-500 text-red-400 hover:text-red-300 font-bold py-3 uppercase tracking-widest transition-all duration-300 text-sm">
                Abort Session
            </button>
        </div>
    </div>

    <!-- Overlay Waktu Habis -->
    <div id="alarmOverlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-alarm-active backdrop-blur-sm transition-opacity duration-300 opacity-0">
        
        <div class="mb-6 animate-pulse">
            <svg class="w-24 h-24 text-red-500 drop-shadow-[0_0_15px_rgba(255,0,0,1)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        
        <h2 class="text-5xl md:text-7xl font-cyber text-white mb-2 tracking-widest text-center text-shadow-md text-red-500 font-bold uppercase drop-shadow-[0_0_20px_rgba(255,0,0,0.8)]">
            TIME UP
        </h2>
        <p class="text-red-200 text-lg mb-12 font-bold tracking-widest uppercase">Session Terminated</p>

        <button id="stopBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold font-cyber tracking-widest uppercase text-xl py-4 px-12 border-2 border-red-400 shadow-[0_0_20px_rgba(255,0,0,0.6)] transition-all active:scale-95">
            Acknowledge
        </button>
    </div>

    <script>
        // --- Variables ---
        let audioCtx = null;
        let beepInterval = null;
        let countdownInterval = null;
        let targetTimestamp = null;
        let calculatedDurationMs = 0;
        let finalUang = 0;
        
        const hargaPerJam = 10000; 
        const batasMaksimal = 20000; // Batas maksimal Rp 20.000

        // --- DOM Elements ---
        const liveClockEl = document.getElementById('liveClock');
        const uangInp = document.getElementById('uangInp');
        const etaText = document.getElementById('etaText');
        const durasiText = document.getElementById('durasiText');
        const warningText = document.getElementById('warningText');
        const startBtn = document.getElementById('startBtn');
        
        const setupView = document.getElementById('setupView');
        const countdownView = document.getElementById('countdownView');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const targetTimeDisplay = document.getElementById('targetTimeDisplay');
        const activePriceDisplay = document.getElementById('activePriceDisplay');
        const cancelBtn = document.getElementById('cancelBtn');
        
        const overlay = document.getElementById('alarmOverlay');
        const stopBtn = document.getElementById('stopBtn');

        const padZero = (num) => String(num).padStart(2, '0');

        // --- Live Clock ---
        function updateLiveClock() {
            const now = new Date();
            liveClockEl.textContent = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // --- Format Rupiah ---
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // --- Event Listener Input dengan Format Titik Otomatis ---
        uangInp.addEventListener('input', function(e) {
            let rawValue = this.value.replace(/[^0-9]/g, '');
            
            if (rawValue !== '') {
                if(rawValue.length > 9) rawValue = rawValue.slice(0, 9);
                this.value = parseInt(rawValue, 10).toLocaleString('id-ID');
            } else {
                this.value = '';
            }
            
            calculateInfo();
        });

        // --- Kalkulasi Durasi dari Nominal Uang ---
        function calculateInfo() {
            let rawString = uangInp.value.replace(/\./g, '');
            let uang = parseInt(rawString, 10);

            if (isNaN(uang) || uang === 0) {
                etaText.textContent = "--:--";
                durasiText.textContent = "-";
                startBtn.disabled = true;
                warningText.classList.add('opacity-0');
                return;
            }

            // Validasi Minimal Rp 10.000
            if (uang < 10000) {
                etaText.textContent = "--:--";
                durasiText.textContent = "-";
                startBtn.disabled = true;
                warningText.textContent = "Error: Minimal Rp 10.000";
                warningText.classList.remove('opacity-0');
                return;
            } 
            // Validasi Maksimal Nominal Rp 20.000
            else if (uang > batasMaksimal) {
                etaText.textContent = "--:--";
                durasiText.textContent = "-";
                startBtn.disabled = true;
                warningText.textContent = `Error: Maksimal ${formatRupiah(batasMaksimal)}`;
                warningText.classList.remove('opacity-0');
                return;
            }
            else {
                warningText.classList.add('opacity-0');
            }

            finalUang = uang; 

            let totalHours = uang / hargaPerJam;
            
            let h = Math.floor(totalHours);
            let m = Math.round((totalHours - h) * 60);
            
            let durasiString = "";
            if(h > 0) durasiString += `${h} H `;
            if(m > 0) durasiString += `${m} M`;
            durasiText.textContent = durasiString.trim();

            calculatedDurationMs = totalHours * 3600000;

            let targetDate = new Date(Date.now() + calculatedDurationMs);
            etaText.innerHTML = `${padZero(targetDate.getHours())}:${padZero(targetDate.getMinutes())}`;
            
            startBtn.disabled = false;
        }

        // --- Mulai Timer ---
        startBtn.addEventListener('click', () => {
            targetTimestamp = Date.now() + calculatedDurationMs;
            
            let targetDate = new Date(targetTimestamp);
            targetTimeDisplay.textContent = `${padZero(targetDate.getHours())}:${padZero(targetDate.getMinutes())}`;
            
            activePriceDisplay.textContent = formatRupiah(finalUang);

            setupView.classList.add('hidden');
            countdownView.classList.remove('hidden');
            countdownView.classList.add('flex');

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            updateCountdown(); 
            countdownInterval = setInterval(updateCountdown, 100); 
        });

        // --- Hitung Mundur ---
        function updateCountdown() {
            let remainingMs = targetTimestamp - Date.now();

            if (remainingMs <= 0) {
                clearInterval(countdownInterval);
                countdownDisplay.textContent = "00:00:00";
                triggerAlarm();
                return;
            }

            let totalSeconds = Math.floor(remainingMs / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            countdownDisplay.textContent = `${padZero(hours)}:${padZero(minutes)}:${padZero(seconds)}`;
        }

        // --- Batalkan/Selesaikan Sesi ---
        cancelBtn.addEventListener('click', resetApp);

        function resetApp() {
            clearInterval(countdownInterval);
            clearInterval(beepInterval);
            
            countdownView.classList.add('hidden');
            countdownView.classList.remove('flex');
            setupView.classList.remove('hidden');
            
            uangInp.value = '';
            calculateInfo(); 
        }

        // --- Alarm Bunyi ---
        function triggerAlarm() {
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            setTimeout(() => overlay.classList.remove('opacity-0'), 50);

            playBeep();
            // Efek suara sirine cepat ala game
            beepInterval = setInterval(() => {
                playBeep();
                setTimeout(playBeep, 100); 
            }, 600);
        }

        // --- Efek Suara Sirine (Square Wave) ---
        function playBeep() {
            if(!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sawtooth'; // Suara lebih tajam (buzz)
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        // --- Matikan Alarm ---
        stopBtn.addEventListener('click', () => {
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                resetApp(); 
            }, 300);
        });
    </script>
</body>
</html>
