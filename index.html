<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP TIME CONTROL — RGB Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            color: #e2e8f0;
            background-color: #020617;
            overflow-x: hidden;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Ikon garis yang dipakai di seluruh halaman */
        .ico {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- ANIMASI LATAR BELAKANG --- */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(45deg, #0f172a, #2e1065, #172554, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- KARTU UTAMA (lapisan paling dasar, ada sorot di tepi atas) --- */
        .glass-panel {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.55), rgba(15, 23, 42, 0.5));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 14px 44px -12px rgba(139, 92, 246, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: panelGlow 6s ease-in-out infinite alternate;
        }

        @keyframes panelGlow {
            0% { box-shadow: 0 10px 40px -10px rgba(139, 92, 246, 0.3), inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 0 1px rgba(255,255,255,0.05); }
            100% { box-shadow: 0 20px 50px -15px rgba(56, 189, 248, 0.3), inset 0 1px 0 rgba(255,255,255,0.12), inset 0 0 0 1px rgba(255,255,255,0.1); }
        }

        /* --- LAPISAN KEDALAMAN DI DALAM KARTU --- */
        /* Kolom nominal: tertanam (inset), border lavender tipis, menyala saat fokus */
        .field-wrap {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            height: 5rem;
            padding: 0 1.25rem 0 1rem;
            border-radius: 1.25rem;
            background-color: rgba(15, 23, 42, 0.6);
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(167, 139, 250, 0.22);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.05);
            cursor: text;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .field-wrap:focus-within {
            background-color: rgba(51, 65, 85, 0.7);
            border-color: #8b5cf6;
            box-shadow: inset 0 2px 15px rgba(0, 0, 0, 0.6), 0 0 22px rgba(139, 92, 246, 0.4);
        }

        #uangInp {
            flex: 1 1 0%;
            min-width: 0;
            height: 100%;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: #fff;
            font-size: 2.25rem;
            font-weight: 300;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        @media (min-width: 768px) {
            #uangInp { font-size: 3rem; }
        }

        #uangInp::placeholder {
            color: rgba(148, 163, 184, 0.55);
            opacity: 1;
        }

        /* Chip ikon bulat-persegi dengan warna sesuai konteks */
        .icon-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.875rem;
        }
        .icon-chip svg { width: 1.25rem; height: 1.25rem; }
        .icon-chip-sm { width: 2rem; height: 2rem; border-radius: 0.65rem; }
        .icon-chip-sm svg { width: 1rem; height: 1rem; }
        .icon-chip-violet {
            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.16);
            box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.24);
        }
        .icon-chip-emerald {
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.14);
            box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.22);
        }

        /* Panel info & kotak statistik: sedikit terangkat dari kartu */
        .info-panel {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 1rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 -10px 24px -14px rgba(0, 0, 0, 0.5);
        }

        .stat-tile {
            border-radius: 1rem;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 -10px 22px -14px rgba(0, 0, 0, 0.55);
        }

        /* Garis pemisah yang memudar di kedua ujung */
        .soft-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.3), transparent);
        }

        /* Status kosong: redup dan berdenyut halus, terkesan "menunggu" */
        .info-value { transition: color 0.3s ease; }

        .info-panel.is-empty .info-value {
            color: rgba(148, 163, 184, 0.55);
            font-weight: 300;
        }

        @keyframes waitPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.95; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .info-panel.is-empty .info-value { animation: waitPulse 2.6s ease-in-out infinite; }
        }

        /* Teks Gradasi */
        .gradient-text-primary {
            background: linear-gradient(to right, #a78bfa, #38bdf8, #a78bfa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        /* --- TOMBOL UTAMA ---
           Lapisan gradasi ada di ::before supaya bisa memudar halus:
           nonaktif = versi pudar dari gradasi yang sama, aktif = gradasi penuh + glow. */
        .btn-cta {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            color: #fff;
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(167, 139, 250, 0.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 14px 30px -12px rgba(99, 102, 241, 0.75);
            transition: box-shadow 0.4s ease, border-color 0.4s ease, color 0.4s ease, transform 0.15s ease;
        }

        .btn-cta::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(90deg, #6d28d9, #3b82f6, #6d28d9);
            background-size: 200% auto;
            transition: opacity 0.4s ease, background-position 0.6s ease;
        }

        .btn-cta:hover:not(:disabled) {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 16px 36px -10px rgba(139, 92, 246, 0.85);
        }

        .btn-cta:hover:not(:disabled)::before {
            background-position: right center;
        }

        .btn-cta:disabled {
            color: rgba(203, 213, 225, 0.5);
            border-color: rgba(148, 163, 184, 0.16);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
        }

        .btn-cta:disabled::before {
            opacity: 0.2;
        }

        .btn-cta:focus-visible {
            outline: 2px solid #c4b5fd;
            outline-offset: 3px;
        }

        /* Efek Berdering */
        @keyframes alarmGlow {
            0% { background-color: rgba(220, 38, 38, 0.85); box-shadow: inset 0 0 100px rgba(0,0,0,0.5); }
            50% { background-color: rgba(153, 27, 27, 0.95); box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
            100% { background-color: rgba(220, 38, 38, 0.85); box-shadow: inset 0 0 100px rgba(0,0,0,0.5); }
        }
        .bg-alarm-active {
            animation: alarmGlow 1s infinite alternate;
        }

        /* Hormati pengaturan "kurangi gerakan" untuk animasi dekoratif */
        @media (prefers-reduced-motion: reduce) {
            .animated-bg, .glass-panel, .gradient-text-primary { animation: none; }
        }

        /* --- VIP RGB REDESIGN --- */
        :root {
            --rgb-cyan: #22f7ff;
            --rgb-pink: #ff35d3;
            --rgb-purple: #8b5cf6;
            --rgb-lime: #c8ff45;
        }
        body {
            min-height: 100svh;
            height: auto;
            padding: 7.5rem 0 2rem;
            background-color: #050510;
        }
        .animated-bg {
            background:
                radial-gradient(ellipse at 15% 15%, rgba(34,247,255,.17), transparent 36%),
                radial-gradient(ellipse at 85% 75%, rgba(255,53,211,.16), transparent 38%),
                linear-gradient(135deg, #050510, #10102b 45%, #090816);
            background-size: 150% 150%;
            animation: rgbAtmosphere 12s ease-in-out infinite alternate;
        }
        @keyframes rgbAtmosphere {
            0% { background-position: 0% 0%; filter:hue-rotate(0deg); }
            100% { background-position: 100% 100%; filter:hue-rotate(28deg); }
        }
        .glass-panel {
            width: min(92%, 34rem);
            padding: clamp(1.25rem, 5vw, 2.5rem);
            border-radius: 1.75rem;
            border: 1px solid transparent;
            background:
                linear-gradient(160deg, rgba(14,17,39,.94), rgba(7,8,22,.92)) padding-box,
                linear-gradient(125deg, rgba(34,247,255,.8), rgba(139,92,246,.55), rgba(255,53,211,.8), rgba(34,247,255,.8)) border-box;
            background-size: auto, 300% 300%;
            animation: panelRGB 8s linear infinite, panelGlow 6s ease-in-out infinite alternate;
            box-shadow: 0 20px 70px rgba(0,0,0,.42), 0 0 36px rgba(139,92,246,.14);
        }
        @keyframes panelRGB { to { background-position: 0 0, 300% 0; } }
        .vip-title {
            position: relative;
            isolation: isolate;
            max-width: 100%;
            font-family: "BRUNSON", "Arial Black", Impact, sans-serif;
            font-size: clamp(1.8rem, 7vw, 3rem);
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: .045em;
            color: transparent;
            background: linear-gradient(100deg, #fff 5%, #9dfcff 22%, #fff 34%, #ff9ae9 52%, #fff 66%, #c8ff45 82%, #fff);
            background-size: 260% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: .45px rgba(255,255,255,.35);
            filter: drop-shadow(0 0 9px rgba(34,247,255,.32));
            animation: titleRGBShine 4s linear infinite;
        }
        .vip-title::after {
            content: "";
            position: absolute;
            z-index: -1;
            inset: -8px -12px;
            border-radius: 18px;
            background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.17) 45%, transparent 60%);
            background-size: 220% 100%;
            animation: sweepGlint 3.2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes titleRGBShine { to { background-position: 260% center; } }
        @keyframes sweepGlint {
            0%, 15% { background-position: 130% 0; opacity: 0; }
            35% { opacity: 1; }
            65%, 100% { background-position: -130% 0; opacity: 0; }
        }
        .subtitle-vip {
            color: #b7c3df;
            letter-spacing: .055em;
        }
        .subtitle-vip span { color: var(--rgb-cyan); text-shadow: 0 0 12px var(--rgb-cyan); }
        .field-wrap {
            min-height: 4.5rem;
            border-color: rgba(34,247,255,.25);
            border-radius: 1rem;
        }
        .field-wrap:focus-within {
            border-color: var(--rgb-cyan);
            box-shadow: inset 0 2px 15px rgba(0,0,0,.5), 0 0 22px rgba(34,247,255,.22), 0 0 3px var(--rgb-cyan);
        }
        .info-panel, .stat-tile {
            border-color: rgba(139,92,246,.22);
            background: linear-gradient(145deg, rgba(17,24,49,.78), rgba(7,10,27,.72));
        }
        .btn-cta {
            border: 1px solid rgba(34,247,255,.62);
            border-radius: 1rem;
            box-shadow: 0 0 18px rgba(34,247,255,.14), 0 12px 30px rgba(0,0,0,.25);
        }
        .btn-cta::before {
            background: linear-gradient(105deg, #5423c8, #087fbb, #c51c9a, #5423c8);
            background-size: 300% 100%;
            animation: buttonRGB 5s linear infinite;
        }
        @keyframes buttonRGB { to { background-position: 300% 0; } }
        .btn-cta:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 26px rgba(34,247,255,.3), 0 14px 35px rgba(139,92,246,.25);
        }
        .btn-cta:disabled { filter: saturate(.35); }
        #liveClock {
            text-shadow: 0 0 12px rgba(34,247,255,.28);
        }
        @media (max-width: 420px) {
            body { padding-top: 6.8rem; }
            .glass-panel { width: 94%; }
            #uangInp { font-size: 1.9rem; }
            .info-panel { padding: .85rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .animated-bg, .glass-panel, .vip-title, .vip-title::after, .btn-cta::before {
                animation: none !important;
            }
        }

    
        /* --- VIP GOLD EDITION: palet mengikuti logo emas, putih, dan hitam --- */
        :root {
            --rgb-cyan: #ffd54a;
            --rgb-pink: #ff9f1c;
            --rgb-purple: #d99a16;
            --rgb-lime: #fff2a6;
            --gold-bright: #fff6b0;
            --gold-main: #ffbf00;
            --gold-deep: #a85b00;
        }
        body {
            color: #fff9e8;
            background-color: #050403;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(255,177,0,.11), transparent 55%);
        }
        .animated-bg {
            background:
                radial-gradient(ellipse at 16% 18%, rgba(255,196,0,.18), transparent 36%),
                radial-gradient(ellipse at 84% 76%, rgba(255,128,0,.13), transparent 38%),
                linear-gradient(135deg, #030303, #171006 48%, #050403);
            background-size: 150% 150%;
            animation: rgbAtmosphere 12s ease-in-out infinite alternate;
        }
        .glass-panel {
            background:
                linear-gradient(160deg, rgba(28,20,7,.97), rgba(7,6,4,.96)) padding-box,
                linear-gradient(125deg, #fff0a0, #ffb300, #8d4b00, #fff4b0, #d88700) border-box;
            box-shadow: 0 20px 70px rgba(0,0,0,.55), 0 0 32px rgba(255,174,0,.18);
            animation: panelGold 6s ease-in-out infinite alternate;
        }
        @keyframes panelGold {
            0% { box-shadow: 0 16px 48px rgba(0,0,0,.45), 0 0 18px rgba(255,174,0,.12); }
            100% { box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 34px rgba(255,196,35,.24); }
        }
        .vip-title {
            color: #fff;
            background: linear-gradient(110deg, #fff 0%, #fff 28%, #ffe9a0 39%, #fff 47%, #ffc42e 52%, #fff 58%, #fff 100%);
            background-size: 260% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: .45px rgba(255,255,255,.55);
            filter: drop-shadow(0 0 8px rgba(255,190,25,.24));
            animation: titleGoldShine 3.8s linear infinite;
        }
        .vip-title::after {
            background: linear-gradient(110deg, transparent 28%, rgba(255,255,255,.05) 38%, rgba(255,230,130,.48) 48%, rgba(255,255,255,.16) 52%, transparent 62%);
            background-size: 220% 100%;
            animation: sweepGoldGlint 3.2s ease-in-out infinite;
        }
        @keyframes titleGoldShine { to { background-position: 260% center; } }
        @keyframes sweepGoldGlint {
            0%, 12% { background-position: 130% 0; opacity: 0; }
            36% { opacity: 1; }
            68%, 100% { background-position: -130% 0; opacity: 0; }
        }
        .subtitle-vip { color: #e8d8b2; }
        .subtitle-vip span {
            color: #ffd54a;
            text-shadow: 0 0 12px rgba(255,197,38,.75);
        }
        .field-wrap {
            background-color: rgba(12,9,4,.78);
            border-color: rgba(255,190,35,.32);
        }
        .field-wrap:focus-within {
            border-color: #ffd54a;
            box-shadow: inset 0 2px 15px rgba(0,0,0,.6), 0 0 22px rgba(255,184,0,.2), 0 0 3px #ffd54a;
        }
        .icon-chip-violet {
            color: #ffe18a;
            background: rgba(255,181,0,.13);
            box-shadow: inset 0 0 0 1px rgba(255,205,75,.28);
        }
        .icon-chip-emerald {
            color: #ffe18a;
            background: rgba(255,181,0,.12);
            box-shadow: inset 0 0 0 1px rgba(255,205,75,.24);
        }
        .info-panel, .stat-tile {
            border-color: rgba(255,190,35,.2);
            background: linear-gradient(145deg, rgba(34,25,9,.82), rgba(9,7,4,.8));
        }
        .info-value.text-emerald-400,
        #activePriceDisplay { color: #ffdc70 !important; }
        .info-value.text-purple-300 { color: #ffe8a3 !important; }
        #liveClock {
            color: #fff1c7;
            text-shadow: 0 0 12px rgba(255,194,36,.3);
        }
        .btn-cta {
            color: #fff;
            border-color: rgba(255,211,89,.78);
            box-shadow: 0 0 18px rgba(255,183,0,.18), 0 12px 30px rgba(0,0,0,.35);
        }
        .btn-cta::before {
            background: linear-gradient(105deg, #6f3900, #d88a00, #ffcf33, #fff0a0, #a95d00, #6f3900);
            background-size: 300% 100%;
            animation: buttonRGB 5s linear infinite;
        }
        .btn-cta:hover:not(:disabled) {
            box-shadow: 0 0 28px rgba(255,190,25,.3), 0 14px 35px rgba(0,0,0,.35);
        }
        .btn-cta:focus-visible { outline-color: #ffe28a; }
        .countdownView h2, #countdownDisplay { text-shadow: 0 0 14px rgba(255,190,25,.25); }
        #countdownDisplay { color: #fff8e7; }
        .bg-alarm-active { animation: alarmGlow 1s infinite alternate; }
        @media (prefers-reduced-motion: reduce) {
            .animated-bg, .glass-panel, .vip-title, .vip-title::after, .btn-cta::before {
                animation: none !important;
            }
        }

    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center selection:bg-purple-600 selection:text-white">

    <div class="animated-bg"></div>

    <!-- Header Waktu -->
    <div class="absolute top-6 w-full text-center z-10">
        <p class="text-slate-400/80 text-[13px] font-medium tracking-wide mb-1.5">Jam saat ini</p>
        <div class="bg-black/40 backdrop-blur-md pl-4 pr-5 py-1.5 rounded-full inline-flex items-center gap-2.5 border border-white/5 shadow-lg">
            <svg class="ico w-4 h-4 text-violet-300/80" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <h2 id="liveClock" class="text-xl font-light tracking-widest text-slate-200 tabular-nums">00:00:00</h2>
        </div>
    </div>

    <!-- Kartu Utama -->
    <div class="glass-panel p-8 md:p-10 rounded-[2rem] flex flex-col items-center w-[92%] max-w-lg relative z-10 transition-all duration-500 mt-4">
        
        <!-- --- TAMPILAN PENGATURAN --- -->
        <div id="setupView" class="w-full flex flex-col items-center">
            <h1 class="vip-title mb-3 text-center">MULAI HITUNG<br class="sm:hidden"> WAKTU VIP</h1>
            <p class="subtitle-vip text-sm mb-8 text-center">VIP TIME CONTROL <span aria-hidden="true">✦</span> Masukkan nominal sewa Anda</p>
            
            <!-- Input Nominal Uang -->
            <div class="w-full mb-6">
                <label for="uangInp" class="block text-[13px] font-medium text-slate-400 tracking-wide mb-3 text-center">Masukkan nominal (Rp)</label>
                <label for="uangInp" class="field-wrap">
                    <span class="icon-chip icon-chip-violet" aria-hidden="true">
                        <svg class="ico" viewBox="0 0 24 24" focusable="false"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17"/><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M21 12.5h-3.5a1.75 1.75 0 0 0 0 3.5H21"/></svg>
                    </span>
                    <span class="text-2xl font-light text-slate-400" aria-hidden="true">Rp</span>
                    <input type="text" inputmode="numeric" id="uangInp" placeholder="10.000">
                </label>
                <!-- Peringatan Dinamis -->
                <p id="warningText" class="text-red-400 text-xs font-medium mt-3 text-center opacity-0 transition-opacity">Minimal nominal adalah Rp 10.000</p>
            </div>

            <!-- Info Real-time (Durasi & ETA) -->
            <div id="infoPanel" class="info-panel is-empty w-full p-4 mb-8 flex flex-col justify-center">
                <div class="flex justify-between items-center text-sm pb-3">
                    <span class="flex items-center gap-2.5 text-slate-400">
                        <span class="icon-chip icon-chip-sm icon-chip-emerald" aria-hidden="true">
                            <svg class="ico" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9.5 2.5h5"/></svg>
                        </span>
                        Waktu didapat
                    </span>
                    <span id="durasiText" class="info-value font-bold text-base text-emerald-400">-</span>
                </div>
                <div class="soft-divider"></div>
                <div class="flex justify-between items-center text-sm pt-3">
                    <span class="flex items-center gap-2.5 text-slate-400">
                        <span class="icon-chip icon-chip-sm icon-chip-violet" aria-hidden="true">
                            <svg class="ico" viewBox="0 0 24 24" focusable="false"><path d="M5 21V4"/><path d="M5 5h13l-2.5 4 2.5 4H5"/></svg>
                        </span>
                        Sesi berakhir pukul
                    </span>
                    <span id="etaText" class="info-value font-semibold text-xl text-purple-300 tabular-nums">--:--</span>
                </div>
            </div>

            <!-- Tombol Mulai -->
            <a id="sociabuzzBtn" href="https://sociabuzz.com/fadilxpozi/tribe" class="btn-cta start-vip w-full flex items-center justify-center gap-2.5 font-semibold py-4 rounded-2xl transform active:scale-95 text-lg tracking-wide" aria-label="OKE PAHAM">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg>
                OKE PAHAM
            </a>
        </div>

        <!-- --- TAMPILAN HITUNG MUNDUR --- -->
        <div id="countdownView" class="w-full hidden flex-col items-center py-2">
            <div class="flex items-center gap-2 mb-6 bg-black/30 px-4 py-1.5 rounded-full border border-white/5">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-purple-500"></span>
                </span>
                <h2 class="text-sm font-medium text-purple-300 tracking-wide">Sesi aktif</h2>
            </div>
            
            <div id="countdownDisplay" class="text-6xl md:text-7xl font-light tracking-tight text-white mb-8 text-center tabular-nums font-serif drop-shadow-xl">
                00:00:00
            </div>
            
            <div class="w-full grid grid-cols-2 gap-4 mb-10 text-center">
                <div class="stat-tile py-3">
                    <p class="flex items-center justify-center gap-1.5 text-xs text-slate-400 mb-1">
                        <svg class="ico w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 21V4"/><path d="M5 5h13l-2.5 4 2.5 4H5"/></svg>
                        Selesai pukul
                    </p>
                    <p id="targetTimeDisplay" class="text-lg font-semibold text-slate-200 tabular-nums">--:--</p>
                </div>
                <div class="stat-tile py-3">
                    <p class="flex items-center justify-center gap-1.5 text-xs text-slate-400 mb-1">
                        <svg class="ico w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 12h.01M17.5 12h.01"/></svg>
                        Uang masuk
                    </p>
                    <p id="activePriceDisplay" class="text-lg font-bold text-emerald-400">Rp 0</p>
                </div>
            </div>

            <button id="cancelBtn" class="w-full flex items-center justify-center gap-2 bg-transparent hover:bg-white/10 border border-slate-600 text-slate-300 font-medium py-3 rounded-2xl transition-all duration-300">
                <svg class="ico w-4 h-4" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
                Hentikan Sesi
            </button>
        </div>
    </div>

    <!-- Overlay Waktu Habis -->
    <div id="alarmOverlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-alarm-active backdrop-blur-xl transition-opacity duration-300 opacity-0">
        
        <div class="bg-white/10 p-6 rounded-full mb-6 backdrop-blur-md border border-white/20 animate-bounce shadow-2xl">
            <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        
        <h2 class="text-4xl md:text-6xl font-serif text-white mb-2 tracking-wider text-center drop-shadow-2xl font-bold">
            WAKTU HABIS
        </h2>
        <p class="text-red-100 text-lg mb-12 font-light">Sesi billing pelanggan telah berakhir.</p>

        <button id="stopBtn" class="bg-white text-red-800 hover:bg-slate-200 font-bold text-lg py-4 px-10 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] transition-transform active:scale-95 tracking-wide">
            Tutup & Matikan Alarm
        </button>
    </div>

    <script>
        // --- Variables ---
        let audioCtx = null;
        let beepInterval = null;
        let countdownInterval = null;
        let targetTimestamp = null;
        let calculatedDurationMs = 0;
        let finalUang = 0;
        
        const hargaPerJam = 10000; // Tarif Tetap Rp 10.000 / Jam
        const batasMaksimal = 20000; // Batas maksimal nominal diatur Rp 20.000

        // --- DOM Elements ---
        const liveClockEl = document.getElementById('liveClock');
        const uangInp = document.getElementById('uangInp');
        const etaText = document.getElementById('etaText');
        const durasiText = document.getElementById('durasiText');
        const warningText = document.getElementById('warningText');
        const infoPanel = document.getElementById('infoPanel');
        
        const setupView = document.getElementById('setupView');
        const countdownView = document.getElementById('countdownView');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const targetTimeDisplay = document.getElementById('targetTimeDisplay');
        const activePriceDisplay = document.getElementById('activePriceDisplay');
        const cancelBtn = document.getElementById('cancelBtn');
        
        const overlay = document.getElementById('alarmOverlay');
        const stopBtn = document.getElementById('stopBtn');

        const padZero = (num) => String(num).padStart(2, '0');

        // --- Live Clock ---
        function updateLiveClock() {
            const now = new Date();
            liveClockEl.textContent = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // --- Format Rupiah ---
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // --- Event Listener Input dengan Format Titik Otomatis ---
        uangInp.addEventListener('input', function(e) {
            let rawValue = this.value.replace(/[^0-9]/g, '');
            
            if (rawValue !== '') {
                if(rawValue.length > 9) rawValue = rawValue.slice(0, 9);
                this.value = parseInt(rawValue, 10).toLocaleString('id-ID');
            } else {
                this.value = '';
            }
            
            calculateInfo();
        });

        // --- Status Info Kosong (placeholder dibuat redup) ---
        function setInfoEmpty() {
            etaText.textContent = "--:--";
            durasiText.textContent = "-";
            infoPanel.classList.add('is-empty');
        }

        // --- Kalkulasi Durasi dari Nominal Uang ---
        function calculateInfo() {
            let rawString = uangInp.value.replace(/\./g, '');
            let uang = parseInt(rawString, 10);

            // Handle input kosong atau bukan angka
            if (isNaN(uang) || uang === 0) {
                setInfoEmpty();
                warningText.classList.add('opacity-0');
                return;
            }

            // Validasi Minimal Rp 10.000
            if (uang < 10000) {
                setInfoEmpty();
                warningText.textContent = "Minimal nominal adalah Rp 10.000";
                warningText.classList.remove('opacity-0');
                return;
            } 
            // Validasi Maksimal Nominal Rp 20.000
            else if (uang > batasMaksimal) {
                setInfoEmpty();
                warningText.textContent = `Batas maksimal adalah ${formatRupiah(batasMaksimal)}`;
                warningText.classList.remove('opacity-0');
                return;
            }
            else {
                warningText.classList.add('opacity-0');
            }

            finalUang = uang;
            infoPanel.classList.remove('is-empty');

            // Hitung durasi (Uang / Harga Per Jam)
            let totalHours = uang / hargaPerJam;
            
            let h = Math.floor(totalHours);
            let m = Math.round((totalHours - h) * 60);
            
            let durasiString = "";
            if(h > 0) durasiString += `${h} Jam `;
            if(m > 0) durasiString += `${m} Menit`;
            durasiText.textContent = durasiString.trim();

            calculatedDurationMs = totalHours * 3600000;

            let targetDate = new Date(Date.now() + calculatedDurationMs);
            etaText.innerHTML = `${padZero(targetDate.getHours())}:${padZero(targetDate.getMinutes())}`;
            
        }

        // --- Hitung Mundur ---
        function updateCountdown() {
            let remainingMs = targetTimestamp - Date.now();

            if (remainingMs <= 0) {
                clearInterval(countdownInterval);
                countdownDisplay.textContent = "00:00:00";
                triggerAlarm();
                return;
            }

            let totalSeconds = Math.floor(remainingMs / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            countdownDisplay.textContent = `${padZero(hours)}:${padZero(minutes)}:${padZero(seconds)}`;
        }

        // --- Batalkan/Selesaikan Sesi ---
        cancelBtn.addEventListener('click', resetApp);

        function resetApp() {
            clearInterval(countdownInterval);
            clearInterval(beepInterval);
            
            countdownView.classList.add('hidden');
            countdownView.classList.remove('flex');
            setupView.classList.remove('hidden');
            
            uangInp.value = '';
            calculateInfo(); 
        }

        // --- Alarm Bunyi ---
        function triggerAlarm() {
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            setTimeout(() => overlay.classList.remove('opacity-0'), 50);

            playBeep();
            beepInterval = setInterval(() => {
                playBeep();
                setTimeout(playBeep, 150); 
            }, 800);
        }

        // --- Efek Suara Sirine ---
        function playBeep() {
            if(!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square'; 
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        // --- Matikan Alarm ---
        stopBtn.addEventListener('click', () => {
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                resetApp(); 
            }, 300);
        });
    </script>
</body>
</html>
