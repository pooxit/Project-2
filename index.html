<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Timer & Billing VIP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            color: #e2e8f0;
            background-color: #020617;
            overflow-x: hidden;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* --- ANIMASI LATAR BELAKANG --- */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(45deg, #0f172a, #2e1065, #172554, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- GLOW KARTU UTAMA --- */
        .glass-panel {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: panelGlow 6s ease-in-out infinite alternate;
        }

        @keyframes panelGlow {
            0% { box-shadow: 0 10px 40px -10px rgba(139, 92, 246, 0.3), inset 0 0 0 1px rgba(255,255,255,0.05); }
            100% { box-shadow: 0 20px 50px -15px rgba(56, 189, 248, 0.3), inset 0 0 0 1px rgba(255,255,255,0.1); }
        }

        /* Styling Input Kustom */
        #uangInp {
            background: rgba(30, 41, 59, 0.6);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        
        #uangInp:focus {
            background: rgba(51, 65, 85, 0.8);
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.6), 0 0 20px rgba(139, 92, 246, 0.4);
            border-color: #8b5cf6;
        }

        /* Teks Gradasi */
        .gradient-text-primary {
            background: linear-gradient(to right, #a78bfa, #38bdf8, #a78bfa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        /* Tombol Animasi */
        .btn-animated {
            background: linear-gradient(90deg, #6d28d9, #3b82f6, #6d28d9);
            background-size: 200% auto;
            transition: 0.5s;
        }
        .btn-animated:hover:not(:disabled) {
            background-position: right center;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
        }

        /* Efek Berdering */
        @keyframes alarmGlow {
            0% { background-color: rgba(220, 38, 38, 0.85); box-shadow: inset 0 0 100px rgba(0,0,0,0.5); }
            50% { background-color: rgba(153, 27, 27, 0.95); box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
            100% { background-color: rgba(220, 38, 38, 0.85); box-shadow: inset 0 0 100px rgba(0,0,0,0.5); }
        }
        .bg-alarm-active {
            animation: alarmGlow 1s infinite alternate;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center selection:bg-purple-600 selection:text-white">

    <div class="animated-bg"></div>

    <!-- Header Waktu -->
    <div class="absolute top-6 w-full text-center z-10">
        <p class="text-slate-400/80 text-xs font-semibold tracking-widest uppercase mb-1">Jam Saat Ini</p>
        <div class="bg-black/40 backdrop-blur-md px-5 py-1.5 rounded-full inline-block border border-white/5 shadow-lg">
            <h2 id="liveClock" class="text-xl font-light tracking-widest text-slate-200">00:00:00</h2>
        </div>
    </div>

    <!-- Kartu Utama -->
    <div class="glass-panel p-8 md:p-10 rounded-[2rem] flex flex-col items-center w-[92%] max-w-lg relative z-10 transition-all duration-500 mt-4">
        
        <!-- --- TAMPILAN PENGATURAN --- -->
        <div id="setupView" class="w-full flex flex-col items-center">
            <h1 class="text-3xl md:text-4xl font-serif gradient-text-primary mb-2 text-center font-bold">Penagihan Sesi</h1>
            <p class="text-sm text-slate-400 mb-8 text-center font-light">Masukkan nominal uang sewa Anda.</p>
            
            <!-- Input Nominal Uang -->
            <div class="w-full mb-6">
                <label class="block text-xs font-semibold text-slate-400 tracking-widest uppercase mb-3 text-center">Masukkan Nominal (Rp)</label>
                <div class="relative flex items-center justify-center">
                    <span class="absolute left-6 text-2xl font-light text-slate-400">Rp</span>
                    <input type="text" inputmode="numeric" id="uangInp" placeholder="10.000" 
                        class="w-full h-20 pl-16 pr-6 text-4xl md:text-5xl text-left text-white rounded-2xl border border-slate-600/50 outline-none font-light shadow-xl">
                </div>
                <!-- Peringatan Dinamis -->
                <p id="warningText" class="text-red-400 text-xs font-medium mt-3 text-center opacity-0 transition-opacity">Minimal nominal adalah Rp 10.000</p>
            </div>

            <!-- Info Real-time (Durasi & ETA) -->
            <div class="w-full bg-slate-900/60 border border-slate-700/50 rounded-xl p-4 mb-8 flex flex-col justify-center gap-2 shadow-inner">
                <div class="flex justify-between items-center text-sm border-b border-slate-700/50 pb-2">
                    <span class="text-slate-400">Waktu Didapat:</span>
                    <span id="durasiText" class="font-bold text-base text-emerald-400">-</span>
                </div>
                <div class="flex justify-between items-center text-sm pt-1">
                    <span class="text-slate-400">Sesi Berakhir Pukul:</span>
                    <span id="etaText" class="font-semibold text-xl text-purple-300">--:--</span>
                </div>
            </div>

            <!-- Tombol Mulai -->
            <button id="startBtn" disabled class="w-full btn-animated disabled:bg-none disabled:bg-slate-800 disabled:text-slate-500 disabled:border-slate-700 disabled:cursor-not-allowed border border-purple-500/30 text-white font-semibold py-4 rounded-xl transform active:scale-95 transition-all text-lg tracking-wide shadow-lg">
                Mulai Sesi
            </button>
        </div>

        <!-- --- TAMPILAN HITUNG MUNDUR --- -->
        <div id="countdownView" class="w-full hidden flex-col items-center py-2">
            <div class="flex items-center gap-2 mb-6 bg-black/30 px-4 py-1.5 rounded-full border border-white/5">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-purple-500"></span>
                </span>
                <h2 class="text-xs font-semibold text-purple-400 uppercase tracking-widest">Sesi Aktif</h2>
            </div>
            
            <div id="countdownDisplay" class="text-6xl md:text-7xl font-light tracking-tight text-white mb-8 text-center tabular-nums font-serif drop-shadow-xl">
                00:00:00
            </div>
            
            <div class="w-full grid grid-cols-2 gap-4 mb-10 text-center">
                <div class="bg-black/40 border border-white/5 rounded-xl py-3 shadow-inner">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Selesai Pukul</p>
                    <p id="targetTimeDisplay" class="text-lg font-semibold text-slate-200">--:--</p>
                </div>
                <div class="bg-black/40 border border-white/5 rounded-xl py-3 shadow-inner">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Uang Masuk</p>
                    <p id="activePriceDisplay" class="text-lg font-bold text-emerald-400">Rp 0</p>
                </div>
            </div>

            <button id="cancelBtn" class="w-full bg-transparent hover:bg-white/10 border border-slate-600 text-slate-300 font-medium py-3 rounded-xl transition-all duration-300">
                Hentikan Sesi
            </button>
        </div>
    </div>

    <!-- Overlay Waktu Habis -->
    <div id="alarmOverlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-alarm-active backdrop-blur-xl transition-opacity duration-300 opacity-0">
        
        <div class="bg-white/10 p-6 rounded-full mb-6 backdrop-blur-md border border-white/20 animate-bounce shadow-2xl">
            <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        
        <h2 class="text-4xl md:text-6xl font-serif text-white mb-2 tracking-wider text-center drop-shadow-2xl font-bold">
            WAKTU HABIS
        </h2>
        <p class="text-red-100 text-lg mb-12 font-light">Sesi billing pelanggan telah berakhir.</p>

        <button id="stopBtn" class="bg-white text-red-800 hover:bg-slate-200 font-bold text-lg py-4 px-10 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] transition-transform active:scale-95 tracking-wide">
            Tutup & Matikan Alarm
        </button>
    </div>

    <script>
        // --- Variables ---
        let audioCtx = null;
        let beepInterval = null;
        let countdownInterval = null;
        let targetTimestamp = null;
        let calculatedDurationMs = 0;
        let finalUang = 0;
        
        const hargaPerJam = 10000; // Tarif Tetap Rp 10.000 / Jam
        const batasMaksimal = 20000; // Batas maksimal nominal diatur Rp 20.000

        // --- DOM Elements ---
        const liveClockEl = document.getElementById('liveClock');
        const uangInp = document.getElementById('uangInp');
        const etaText = document.getElementById('etaText');
        const durasiText = document.getElementById('durasiText');
        const warningText = document.getElementById('warningText');
        const startBtn = document.getElementById('startBtn');
        
        const setupView = document.getElementById('setupView');
        const countdownView = document.getElementById('countdownView');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const targetTimeDisplay = document.getElementById('targetTimeDisplay');
        const activePriceDisplay = document.getElementById('activePriceDisplay');
        const cancelBtn = document.getElementById('cancelBtn');
        
        const overlay = document.getElementById('alarmOverlay');
        const stopBtn = document.getElementById('stopBtn');

        const padZero = (num) => String(num).padStart(2, '0');

        // --- Live Clock ---
        function updateLiveClock() {
            const now = new Date();
            liveClockEl.textContent = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // --- Format Rupiah ---
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // --- Event Listener Input dengan Format Titik Otomatis ---
        uangInp.addEventListener('input', function(e) {
            let rawValue = this.value.replace(/[^0-9]/g, '');
            
            if (rawValue !== '') {
                if(rawValue.length > 9) rawValue = rawValue.slice(0, 9);
                this.value = parseInt(rawValue, 10).toLocaleString('id-ID');
            } else {
                this.value = '';
            }
            
            calculateInfo();
        });

        // --- Kalkulasi Durasi dari Nominal Uang ---
        function calculateInfo() {
            let rawString = uangInp.value.replace(/\./g, '');
            let uang = parseInt(rawString, 10);

            // Handle input kosong atau bukan angka
            if (isNaN(uang) || uang === 0) {
                etaText.textContent = "--:--";
                durasiText.textContent = "-";
                startBtn.disabled = true;
                warningText.classList.add('opacity-0');
                return;
            }

            // Validasi Minimal Rp 10.000
            if (uang < 10000) {
                etaText.textContent = "--:--";
                durasiText.textContent = "-";
                startBtn.disabled = true;
                warningText.textContent = "Minimal nominal adalah Rp 10.000";
                warningText.classList.remove('opacity-0');
                return;
            } 
            // Validasi Maksimal Nominal Rp 20.000
            else if (uang > batasMaksimal) {
                etaText.textContent = "--:--";
                durasiText.textContent = "-";
                startBtn.disabled = true;
                warningText.textContent = `Batas maksimal adalah ${formatRupiah(batasMaksimal)}`;
                warningText.classList.remove('opacity-0');
                return;
            }
            else {
                warningText.classList.add('opacity-0');
            }

            finalUang = uang; 

            // Hitung durasi (Uang / Harga Per Jam)
            let totalHours = uang / hargaPerJam;
            
            let h = Math.floor(totalHours);
            let m = Math.round((totalHours - h) * 60);
            
            let durasiString = "";
            if(h > 0) durasiString += `${h} Jam `;
            if(m > 0) durasiString += `${m} Menit`;
            durasiText.textContent = durasiString.trim();

            calculatedDurationMs = totalHours * 3600000;

            let targetDate = new Date(Date.now() + calculatedDurationMs);
            etaText.innerHTML = `${padZero(targetDate.getHours())}:${padZero(targetDate.getMinutes())}`;
            
            startBtn.disabled = false;
        }

        // --- Mulai Timer ---
        startBtn.addEventListener('click', () => {
            targetTimestamp = Date.now() + calculatedDurationMs;
            
            let targetDate = new Date(targetTimestamp);
            targetTimeDisplay.textContent = `${padZero(targetDate.getHours())}:${padZero(targetDate.getMinutes())}`;
            
            activePriceDisplay.textContent = formatRupiah(finalUang);

            setupView.classList.add('hidden');
            countdownView.classList.remove('hidden');
            countdownView.classList.add('flex');

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            updateCountdown(); 
            countdownInterval = setInterval(updateCountdown, 100); 
        });

        // --- Hitung Mundur ---
        function updateCountdown() {
            let remainingMs = targetTimestamp - Date.now();

            if (remainingMs <= 0) {
                clearInterval(countdownInterval);
                countdownDisplay.textContent = "00:00:00";
                triggerAlarm();
                return;
            }

            let totalSeconds = Math.floor(remainingMs / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            countdownDisplay.textContent = `${padZero(hours)}:${padZero(minutes)}:${padZero(seconds)}`;
        }

        // --- Batalkan/Selesaikan Sesi ---
        cancelBtn.addEventListener('click', resetApp);

        function resetApp() {
            clearInterval(countdownInterval);
            clearInterval(beepInterval);
            
            countdownView.classList.add('hidden');
            countdownView.classList.remove('flex');
            setupView.classList.remove('hidden');
            
            uangInp.value = '';
            calculateInfo(); 
        }

        // --- Alarm Bunyi ---
        function triggerAlarm() {
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            setTimeout(() => overlay.classList.remove('opacity-0'), 50);

            playBeep();
            beepInterval = setInterval(() => {
                playBeep();
                setTimeout(playBeep, 150); 
            }, 800);
        }

        // --- Efek Suara Sirine ---
        function playBeep() {
            if(!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square'; 
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        // --- Matikan Alarm ---
        stopBtn.addEventListener('click', () => {
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                resetApp(); 
            }, 300);
        });
    </script>
</body>
</html>
